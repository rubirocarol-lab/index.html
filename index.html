const STORAGE_KEY = "wellness_hub_v3";
const TODAY = new Date().toISOString().split("T")[0];

const defaultState = {
  date: TODAY,
  foods: [],
  water: 0,
  steps: 0,
  stepHistory: [],
  habits: { water: false, devotion: false, sleep: 0 },
  goals: { calories: 2000, water: 2500, steps: 10000, sleep: 8, protein: 150, monthlySteps: 300000 },
  programs: [],
  workoutSessions: [],
  weightLog: [],
  goalWeight: null,
  heightCm: null,
  cycle: {
    periodDates: [],   // [{ start: "YYYY-MM-DD", end: "YYYY-MM-DD|null" }]
    ovulationDates: [], // ["YYYY-MM-DD"]
    symptoms: {},      // { "YYYY-MM-DD": { checklist: [...], notes: "" } }
    avgCycleLength: 28,
    avgPeriodDuration: 5,
  },
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState;
    const saved = JSON.parse(raw);
    if (saved.date !== TODAY) {
      return { ...defaultState, ...saved, date: TODAY, foods: [], water: 0, steps: 0, habits: { water: false, devotion: false, sleep: 0 } };
    }
    return { ...defaultState, ...saved };
  } catch { return defaultState; }
}

async function callAI(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1200, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await res.json();
  return data.content.map(b => b.text || "").join("");
}

// Smart toGrams that uses food-specific item/cup weights when available
function smartToGrams(qty, unit, food) {
  if (unit === "g" || unit === "ml") return qty;
  if (unit === "kg") return qty * 1000;
  if (unit === "l")  return qty * 1000;
  if (unit === "oz") return qty * 28.35;
  if (unit === "lb") return qty * 453.6;
  if (unit === "tbsp") return qty * 15;
  if (unit === "tsp")  return qty * 5;
  if (unit === "cup")  return qty * (food?.cupG || 240);
  if (unit === "item" || unit === "slice" || unit === "portion") return qty * (food?.itemG || 100);
  return qty * 100;

function searchLocalDB(query) {
  const q = query.toLowerCase().trim();
  const words = q.split(/\s+/).filter(w => w.length > 1);
  const scored = FOOD_DB.map(food => {
    const name = food.name.toLowerCase();
    let score = 0;
    words.forEach(word => {
      if (name.startsWith(word)) score += 3;
      else if (name.includes(word)) score += 1;
    });
    return { food, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, 6).map(x => x.food);
}

  { value: "kg", label: "kilograms (kg)", toG: 1000 },
  { value: "ml", label: "millilitres (ml)" },
  { value: "l", label: "litres (l)", toG: 1000 },
  { value: "cup", label: "cup (~240ml)", toG: 240 },
  { value: "tbsp", label: "tablespoon (~15ml)", toG: 15 },
  { value: "tsp", label: "teaspoon (~5ml)", toG: 5 },
  { value: "oz", label: "ounces (oz)", toG: 28.35 },
  { value: "lb", label: "pounds (lb)", toG: 453.6 },
  { value: "item", label: "item / piece", toG: null },
  { value: "slice", label: "slice", toG: null },
  { value: "portion", label: "portion", toG: null },
];

function toGrams(qty, unit) {
  // All database values are per 100g/ml.
  // This function returns the actual gram/ml amount so factor = toGrams(qty,unit)/100
  if (unit === "g" || unit === "ml") return qty;          // 100g - 100, 250ml -> 250
  if (unit === "kg") return qty * 1000;
  if (unit === "l")  return qty * 1000;
  if (unit === "cup")  return qty * 240;
  if (unit === "tbsp") return qty * 15;
  if (unit === "tsp")  return qty * 5;
  if (unit === "oz")   return qty * 28.35;
  if (unit === "lb")   return qty * 453.6;
  // items / slices / portions: treat qty itself as 100g units
  // i.e. 1 item = 100g equivalent, so factor = qty
  return qty * 100;
}

const SYMPTOM_LIST = [
  "Cramps", "Bloating", "Spotting", "Heavy flow", "Light flow",
  "Breast tenderness", "Headache", "Fatigue", "Mood swings",

<script type="text/babel">

// -- UI --
function Card({ children, style }) {
  return <div style={{ background: "var(--color-background-primary,#fff)", border: "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.1))", borderRadius: 12, padding: "14px 18px", marginBottom: 12, ...style }}>{children}</div>;
}
function CT({ icon, children }) {
  return <p style={{ fontSize: 15, fontWeight: 500, display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}><i className={`ti ${icon}`} aria-hidden="true" />{children}</p>;
}
function Btn({ children, onClick, primary, danger, small, style, disabled }) {
  return <button onClick={onClick} disabled={disabled} style={{ padding: small ? "5px 10px" : "8px 14px", borderRadius: 8, border: danger ? "0.5px solid #F7C1C1" : "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", background: primary ? "var(--color-text-primary,#1a1a1a)" : "var(--color-background-primary,#fff)", color: primary ? "var(--color-background-primary,#fff)" : danger ? "#A32D2D" : "var(--color-text-primary,#1a1a1a)", fontSize: small ? 12 : 14, cursor: disabled ? "default" : "pointer", opacity: disabled ? 0.5 : 1, display: "inline-flex", alignItems: "center", gap: 5, whiteSpace: "nowrap", flexShrink: 0, fontFamily: "inherit", ...style }}>{children}</button>;
}
function Inp({ value, onChange, type = "text", placeholder, style, onKeyDown, min, max, step }) {
  return <input value={value} onChange={onChange} type={type} placeholder={placeholder} onKeyDown={onKeyDown} min={min} max={max} step={step} style={{ padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", width: "100%", fontFamily: "inherit", boxSizing: "border-box", ...style }} />;
}
function Sel({ value, onChange, children, style }) {
  return <select value={value} onChange={onChange} style={{ padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", fontFamily: "inherit", ...style }}>{children}</select>;
}
function PBar({ value, max, color = "#1D9E75" }) {
  const pct = Math.min(100, max > 0 ? Math.round((value / max) * 100) : 0);
  return <div style={{ height: 8, background: "var(--color-background-secondary,#eee)", borderRadius: 4, overflow: "hidden", marginTop: 4 }}><div style={{ height: "100%", width: pct + "%", background: color, borderRadius: 4, transition: "width 0.3s" }} /></div>;
}
function MCard({ label, value, unit, color }) {
  return <div style={{ background: "var(--color-background-secondary,#f8f8f5)", borderRadius: 8, padding: "12px 14px" }}><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 2 }}>{label}</p><p style={{ fontSize: 19, fontWeight: 500, color: color || "var(--color-text-primary,#1a1a1a)" }}>{value}</p><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{unit}</p></div>;
}
function Toggle({ on, onClick }) {
  return <button onClick={onClick} style={{ width: 40, height: 22, borderRadius: 11, background: on ? "#1D9E75" : "var(--color-background-secondary,#ddd)", border: "none", cursor: "pointer", position: "relative", transition: "background 0.2s", flexShrink: 0 }}><span style={{ position: "absolute", top: 3, left: 3, width: 16, height: 16, borderRadius: "50%", background: "#fff", transition: "transform 0.2s", transform: on ? "translateX(18px)" : "none", display: "block" }} /></button>;
}
function Tag({ children, color = "green" }) {
  const c = { green: ["#EAF3DE","#3B6D11"], amber: ["#FAEEDA","#854F0B"], blue: ["#E6F1FB","#185FA5"], pink: ["#FBEAF0","#993556"], purple: ["#EEEDFE","#534AB7"], teal: ["#E1F5EE","#0F6E56"], red: ["#FCEBEB","#A32D2D"] };
  const [bg, text] = c[color] || c.green;
  return <span style={{ background: bg, color: text, fontSize: 11, fontWeight: 500, padding: "2px 8px", borderRadius: 10 }}>{children}</span>;
}
function AIBox({ text, loading }) {
  if (!text && !loading) return null;
  return <div style={{ background: "var(--color-background-secondary,#f8f8f5)", borderRadius: 8, padding: "10px 12px", marginTop: 8, fontSize: 13, lineHeight: 1.6, color: "var(--color-text-secondary,#555)", whiteSpace: "pre-wrap" }}>{loading ? "Thinking..." : text}</div>;
}
function Chip({ label, active, onClick }) {
  return <button onClick={onClick} style={{ padding: "5px 12px", borderRadius: 20, border: "0.5px solid", borderColor: active ? "var(--color-text-primary,#1a1a1a)" : "var(--color-border-secondary,rgba(0,0,0,0.2))", background: active ? "var(--color-text-primary,#1a1a1a)" : "var(--color-background-primary,#fff)", color: active ? "var(--color-background-primary,#fff)" : "var(--color-text-secondary,#666)", fontSize: 13, cursor: "pointer", whiteSpace: "nowrap", fontFamily: "inherit" }}>{label}</button>;
}

const TABS = [
  { id: "nutrition", label: "Nutrition", icon: "ti-salad" },
  { id: "workouts", label: "Workouts", icon: "ti-barbell" },
  { id: "steps", label: "Steps", icon: "ti-shoe" },
  { id: "habits", label: "Habits", icon: "ti-checklist" },
  { id: "goals", label: "Goals", icon: "ti-target" },
  { id: "weight", label: "Weight", icon: "ti-scale" },
  { id: "cycle", label: "Cycle", icon: "ti-moon" },
];

// -- NUTRITION --
function NutritionTab({ state, setState }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [aiText, setAiText] = useState(""); const [aiLoading, setAiLoading] = useState(false); const [aiFood, setAiFood] = useState(null);
  const [servingQty, setServingQty] = useState({}); const [servingUnit, setServingUnit] = useState({});
  const [manName, setManName] = useState(""); const [manQty, setManQty] = useState(""); const [manUnit, setManUnit] = useState("g");
  const [manCals, setManCals] = useState(""); const [manProt, setManProt] = useState(""); const [manCarbs, setManCarbs] = useState(""); const [manFat, setManFat] = useState(""); const [manFibre, setManFibre] = useState("");
  const [waterInput, setWaterInput] = useState("");

  const totalCals = state.foods.reduce((s, f) => s + (f.calories || 0), 0);
  const totalProt = state.foods.reduce((s, f) => s + (f.protein || 0), 0);
  const totalCarbs = state.foods.reduce((s, f) => s + (f.carbs || 0), 0);
  const totalFat = state.foods.reduce((s, f) => s + (f.fat || 0), 0);

  async function doSearch() {
    if (!query.trim()) return;
    setSearching(true); setResults([]); setAiText(""); setAiFood(null);

    // 1. Check local built-in database first (instant, no network)
    const localResults = searchLocalDB(query);
    if (localResults.length) {
      setResults(localResults.map(f => ({ ...f, fromDB: true })));
      const initU = {}; localResults.forEach(f => { initU[f.name] = f.itemG ? "item" : "g"; });
      setServingUnit(initU);
      const initQ = {}; localResults.forEach(f => { initQ[f.name] = f.itemG ? "1" : "100"; });
      setServingQty(initQ);
      setSearching(false);
      return;
    }

    // 2. Not in local DB - ask AI for accurate nutritional data
    setAiLoading(true);
    try {
      const res = await callAI(`You are a nutrition database. Give accurate nutritional values per 100g for: "${query}". Keep description to 1 sentence. End with exactly: CALORIES:[number] PROTEIN:[number] CARBS:[number] FAT:[number]. Use well-known reference values (e.g. cooked chicken breast = 165 kcal, 31g protein, 0g carbs, 3.6g fat per 100g).`);
      const parse = (key) => { const m = res.match(new RegExp(key + ":[\\d.]+", "i")); return m ? parseFloat(m[0].split(":")[1]) : 0; };
      const cleanText = res.replace(/CALORIES:[\d.]+/ig,"").replace(/PROTEIN:[\d.]+/ig,"").replace(/CARBS:[\d.]+/ig,"").replace(/FAT:[\d.]+/ig,"").trim();
      setAiText(cleanText);
      setAiFood({ name: query, calories: Math.round(parse("CALORIES")), protein: Math.round(parse("PROTEIN") * 10) / 10, carbs: Math.round(parse("CARBS") * 10) / 10, fat: Math.round(parse("FAT") * 10) / 10, qty: "100g" });
    } catch { setAiText("Search failed. Try typing the food name manually below."); }
    setAiLoading(false);
    setSearching(false);
  }

  function addFromDB(product) {
    const key = product.fromDB ? product.name : product.product_name;
    const rawQty = parseFloat(servingQty[key] || "100") || 100;
    const unit = servingUnit[key] || "g";
    const grams = smartToGrams(rawQty, unit, product.fromDB ? product : null);
    const factor = grams / 100;
    let food;
    if (product.fromDB) {
      const unitLabel = unit === "item" && product.note ? product.note : `${rawQty} ${unit}`;
      food = {
        name: product.name,
        calories: Math.round(product.cal * factor),
        protein: Math.round(product.pro * factor * 10) / 10,
        carbs: Math.round(product.carb * factor * 10) / 10,
        fat: Math.round(product.fat * factor * 10) / 10,
        serving: unitLabel,
      };
    } else {
      const n = product.nutriments;
      food = {
        name: product.product_name + (product.brands ? ` (${product.brands})` : ""),
        calories: Math.round((n["energy-kcal_100g"] || n["energy-kcal"] || 0) * factor),
        protein: Math.round((n.proteins_100g || 0) * factor * 10) / 10,
        carbs: Math.round((n.carbohydrates_100g || 0) * factor * 10) / 10,
        fat: Math.round((n.fat_100g || 0) * factor * 10) / 10,
        serving: `${rawQty} ${unit}`,
      };
    }
    setState(s => ({ ...s, foods: [...s.foods, food] }));
    setResults([]); setQuery("");
  }

  function addManual() {
    if (!manName.trim()) return;
    setState(s => ({ ...s, foods: [...s.foods, { name: manName, calories: parseInt(manCals) || 0, protein: parseFloat(manProt) || 0, carbs: parseFloat(manCarbs) || 0, fat: parseFloat(manFat) || 0, fibre: parseFloat(manFibre) || 0, serving: `${manQty} ${manUnit}` }] }));
    setManName(""); setManQty(""); setManCals(""); setManProt(""); setManCarbs(""); setManFat(""); setManFibre("");
  }

  function addWater(ml) { setState(s => ({ ...s, water: s.water + ml })); }
  function addWaterCustom() { const v = parseInt(waterInput) || 0; if (v > 0) { addWater(v); setWaterInput(""); } }

  const totalFibre = state.foods.reduce((s, f) => s + (f.fibre || 0), 0);
  const calPct = Math.min(100, Math.round(totalCals / state.goals.calories * 100));
  const protPct = Math.min(100, Math.round(totalProt / (state.goals.protein || 150) * 100));
  // Macro split percentages (of calories)
  const protCals = totalProt * 4; const carbCals = totalCarbs * 4; const fatCals = totalFat * 9;
  const totalMacroCals = protCals + carbCals + fatCals || 1;
  const protSplit = Math.round(protCals / totalMacroCals * 100);
  const carbSplit = Math.round(carbCals / totalMacroCals * 100);
  const fatSplit = Math.round(fatCals / totalMacroCals * 100);

  return (
    <div>
      {/* Calorie summary */}
      <Card style={{ marginBottom: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <p style={{ fontSize: 15, fontWeight: 500 }}>Calories</p>
          <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}><span style={{ fontSize: 22, fontWeight: 600, color: "#D85A30" }}>{totalCals}</span> / {state.goals.calories} kcal</p>
        </div>
        <PBar value={totalCals} max={state.goals.calories} color="#D85A30" />
        <p style={{ fontSize: 11, color: "var(--color-text-secondary,#666)", marginTop: 3 }}>{state.goals.calories - totalCals > 0 ? `${state.goals.calories - totalCals} kcal remaining` : `${totalCals - state.goals.calories} kcal over goal`}</p>
      </Card>

      {/* Macros breakdown */}
      <Card style={{ marginBottom: 10 }}>
        <CT icon="ti-chart-pie">Macros Breakdown</CT>

        {/* Visual bar split */}
        {totalMacroCals > 1 && (
          <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", marginBottom: 10, gap: 2 }}>
            <div style={{ width: protSplit + "%", background: "#534AB7", borderRadius: "5px 0 0 5px" }} title={`Protein ${protSplit}%`} />
            <div style={{ width: carbSplit + "%", background: "#BA7517" }} title={`Carbs ${carbSplit}%`} />
            <div style={{ width: fatSplit + "%", background: "#1D9E75", borderRadius: "0 5px 5px 0" }} title={`Fat ${fatSplit}%`} />
          </div>
        )}

        {/* Each macro row */}
        {[
          { label: "Protein", value: totalProt, goal: state.goals.protein || 150, unit: "g", color: "#534AB7", split: protSplit },
          { label: "Carbohydrates", value: totalCarbs, goal: null, unit: "g", color: "#BA7517", split: carbSplit },
          { label: "Fat", value: totalFat, goal: null, unit: "g", color: "#1D9E75", split: fatSplit },
          { label: "Fibre", value: totalFibre, goal: 25, unit: "g", color: "#0F6E56", split: null },
        ].map((m, i) => (
          <div key={i} style={{ marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 2 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 10, height: 10, borderRadius: "50%", background: m.color, display: "inline-block" }} />
                {m.label}
                {m.split !== null && <span style={{ fontSize: 11, color: "var(--color-text-secondary,#666)" }}>({m.split}% of cals)</span>}
              </span>
              <span style={{ color: "var(--color-text-secondary,#666)" }}>
                <strong style={{ color: m.color }}>{m.value.toFixed(1)}{m.unit}</strong>
                {m.goal ? ` / ${m.goal}${m.unit} goal` : ""}
              </span>
            </div>
            {m.goal && <PBar value={m.value} max={m.goal} color={m.color} />}
            {!m.goal && <div style={{ height: 6, background: m.color, borderRadius: 3, opacity: 0.25, marginTop: 4 }} />}
          </div>
        ))}
      </Card>

      <Card>
        <CT icon="ti-search">Search Food Database</CT>
        <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 8 }}>80+ built-in whole foods + AI for anything else.</p>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <Inp value={query} onChange={e => setQuery(e.target.value)} placeholder="e.g. oats, ugali, avocado, jollof rice..." onKeyDown={e => e.key === "Enter" && doSearch()} />
          <Btn onClick={doSearch} primary disabled={searching}><i className="ti ti-search" aria-hidden="true" />{searching ? "..." : "Search"}</Btn>
        </div>

        {results.map((p, i) => {
          const isLocal = p.fromDB;
          const key = isLocal ? p.name : p.product_name;
          const kcal = isLocal ? p.cal : Math.round((p.nutriments?.["energy-kcal_100g"] || p.nutriments?.["energy-kcal"] || 0));
          const prot = isLocal ? p.pro : (p.nutriments?.proteins_100g || 0).toFixed(1);
          const carb = isLocal ? p.carb : (p.nutriments?.carbohydrates_100g || 0).toFixed(1);
          const fat = isLocal ? p.fat : (p.nutriments?.fat_100g || 0).toFixed(1);
          // Smart defaults: foods with itemG default to "1 item", drinks/liquids to ml
          const defaultUnit = isLocal && p.itemG ? "item" : "g";
          const defaultQty = isLocal && p.itemG ? "1" : "100";
          const qty = servingQty[key] !== undefined ? servingQty[key] : defaultQty;
          const unit = servingUnit[key] !== undefined ? servingUnit[key] : defaultUnit;
          const estCals = Math.round(kcal * smartToGrams(parseFloat(qty) || 100, unit, p.fromDB ? p : null) / 100);
          return (
            <div key={i} style={{ padding: "10px 0", borderBottom: "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                <p style={{ fontSize: 14, fontWeight: 500 }}>{key}</p>
                {isLocal && <span style={{ fontSize: 11, background: "#EAF3DE", color: "#3B6D11", padding: "1px 6px", borderRadius: 8, flexShrink: 0 }}>✓ Verified</span>}
              </div>
              <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>
                {kcal} kcal · {prot}g protein · {carb}g carbs · {fat}g fat <span style={{ opacity: 0.6 }}>per 100g</span>
              </p>
              {isLocal && p.note && <p style={{ fontSize: 11, color: "#534AB7", marginBottom: 6 }}>💡 {p.note}</p>}
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <Inp type="number" value={qty} onChange={e => setServingQty(q => ({ ...q, [key]: e.target.value }))} placeholder="Qty" style={{ width: 60 }} />
                <Sel value={unit} onChange={e => setServingUnit(u => ({ ...u, [key]: e.target.value }))} style={{ flex: 1, minWidth: 130 }}>
                  {UNIT_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </Sel>
                <span style={{ fontSize: 13, color: "#D85A30", flexShrink: 0, fontWeight: 600 }}>≈ {estCals} kcal</span>
                <Btn onClick={() => addFromDB(p)} primary small><i className="ti ti-plus" aria-hidden="true" /> Add</Btn>
              </div>
            </div>
          );
        })}

        {(aiText || aiLoading) && (
          <>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginTop: 8 }}>Not in database - AI estimate (per 100g):</p>
            <AIBox text={aiText} loading={aiLoading} />
            {aiFood && !aiLoading && <Btn onClick={() => { setState(s => ({ ...s, foods: [...s.foods, aiFood] })); setQuery(""); setAiText(""); setAiFood(null); }} primary style={{ marginTop: 8 }}><i className="ti ti-plus" aria-hidden="true" /> Add AI estimate ({aiFood.calories} kcal)</Btn>}
          </>
        )}

      <Card>
        <CT icon="ti-pencil">Manual Entry</CT>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
          <Inp value={manName} onChange={e => setManName(e.target.value)} placeholder="Food name" style={{ flex: "2 1 140px" }} />
          <Inp value={manQty} onChange={e => setManQty(e.target.value)} type="number" placeholder="Qty" style={{ flex: "0 0 70px" }} />
          <Sel value={manUnit} onChange={e => setManUnit(e.target.value)} style={{ flex: "1 1 120px" }}>
            {UNIT_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </Sel>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
          <Inp value={manCals} onChange={e => setManCals(e.target.value)} type="number" placeholder="kcal" style={{ flex: "1 1 60px" }} />
          <Inp value={manProt} onChange={e => setManProt(e.target.value)} type="number" placeholder="protein g" style={{ flex: "1 1 60px" }} />
          <Inp value={manCarbs} onChange={e => setManCarbs(e.target.value)} type="number" placeholder="carbs g" style={{ flex: "1 1 60px" }} />
          <Inp value={manFat} onChange={e => setManFat(e.target.value)} type="number" placeholder="fat g" style={{ flex: "1 1 60px" }} />
          <Inp value={manFibre} onChange={e => setManFibre(e.target.value)} type="number" placeholder="fibre g" style={{ flex: "1 1 60px" }} />
          <Btn onClick={addManual} primary><i className="ti ti-plus" aria-hidden="true" /> Add</Btn>
        </div>
      </Card>

      <Card>
        <CT icon="ti-droplet">Water Intake</CT>
        <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
          <Inp value={waterInput} onChange={e => setWaterInput(e.target.value)} type="number" placeholder="ml" style={{ flex: "1 1 80px" }} />
          <Btn onClick={() => addWater(250)}>+250ml</Btn>
          <Btn onClick={() => addWater(500)}>+500ml</Btn>
          <Btn onClick={() => addWater(750)}>+750ml</Btn>
          <Btn onClick={addWaterCustom} primary><i className="ti ti-plus" aria-hidden="true" /></Btn>
        </div>
        <PBar value={state.water} max={state.goals.water} color="#1D9E75" />
        <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginTop: 4 }}>{state.water.toLocaleString()} / {state.goals.water.toLocaleString()} ml</p>
      </Card>

      <Card>
        <CT icon="ti-list">Today's Food Log</CT>
        {!state.foods.length ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>Nothing logged yet.</p>
          : state.foods.map((f, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: i < state.foods.length - 1 ? "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" : "none" }}>
              <div>
                <p style={{ fontSize: 14, fontWeight: 500 }}>{f.name}</p>
                <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{f.serving ? `${f.serving} · ` : ""}{f.calories} kcal · {f.protein}g P · {f.carbs}g C · {f.fat}g F{f.fibre ? ` · ${f.fibre}g fibre` : ""}</p>
              </div>
              <Btn onClick={() => setState(s => ({ ...s, foods: s.foods.filter((_, j) => j !== i) }))} danger small><i className="ti ti-trash" aria-hidden="true" /></Btn>
            </div>
          ))}
      </Card>
    </div>
  );
}

// -- WORKOUTS --
function WorkoutsTab({ state, setState }) {
  const [view, setView] = useState("programs");
  const [exSearch, setExSearch] = useState(""); const [exResult, setExResult] = useState(""); const [exLoading, setExLoading] = useState(false);
  const [progName, setProgName] = useState(""); const [activeProg, setActiveProg] = useState(null);
  const [exName, setExName] = useState(""); const [exSets, setExSets] = useState("");
  const [sessionProg, setSessionProg] = useState(null); const [sessionSets, setSessionSets] = useState({}); const [sessionNotes, setSessionNotes] = useState("");
  const [histFilter, setHistFilter] = useState(null);
  // Suggest
  const [selectedAreas, setSelectedAreas] = useState([]);
  const [fitnessLevel, setFitnessLevel] = useState("intermediate");
  const [equipment, setEquipment] = useState("gym");
  const [suggestResult, setSuggestResult] = useState(""); const [suggestLoading, setSuggestLoading] = useState(false);

  async function searchEx() {
    if (!exSearch.trim()) return; setExLoading(true); setExResult("");
    try { const r = await callAI(`Fitness coach. Describe "${exSearch}": muscles worked, 2-3 key form points, a common mistake to avoid. 4-5 sentences.`); setExResult(r); }
    catch { setExResult("Could not fetch info."); }
    setExLoading(false);
  }

  async function getSuggestions() {
    if (!selectedAreas.length) return;
    setSuggestLoading(true); setSuggestResult("");
    const areaNames = selectedAreas.map(id => BODY_AREAS.find(a => a.id === id)?.label).join(", ");
    try {
      const r = await callAI(`You are a personal trainer. Suggest a workout plan targeting: ${areaNames}. Fitness level: ${fitnessLevel}. Equipment: ${equipment === "gym" ? "full gym" : equipment === "home" ? "home/bodyweight" : "resistance bands/dumbbells only"}. Provide 6-8 exercises with sets, reps, and a brief note on each. Format clearly.`);
      setSuggestResult(r);
    } catch { setSuggestResult("Could not generate suggestions."); }
    setSuggestLoading(false);
  }

  function createProg() {
    if (!progName.trim()) return;
    const p = { id: Date.now().toString(), name: progName, exercises: [] };
    setState(s => ({ ...s, programs: [...s.programs, p] }));
    setProgName(""); setActiveProg(p.id);
  }

  function addEx(progId) {
    if (!exName.trim()) return;
    setState(s => ({ ...s, programs: s.programs.map(p => p.id === progId ? { ...p, exercises: [...p.exercises, { name: exName, sets: exSets, ytQuery: encodeURIComponent(exName + " proper form tutorial") }] } : p) }));
    setExName(""); setExSets("");
  }

  function startSession(prog) {
    const init = {}; prog.exercises.forEach((_, i) => { init[i] = [{ reps: "", weight: "" }]; });
    setSessionProg(prog); setSessionSets(init); setSessionNotes(""); setView("session");
  }

  function saveSession() {
    if (!sessionProg) return;
    const exercises = sessionProg.exercises.map((e, i) => ({ name: e.name, sets: (sessionSets[i] || []).filter(s => s.reps || s.weight) }));
    setState(s => ({ ...s, workoutSessions: [...(s.workoutSessions || []), { id: Date.now().toString(), date: TODAY, programName: sessionProg.name, programId: sessionProg.id, exercises, notes: sessionNotes }] }));
    setView("programs"); setSessionProg(null);
  }

  function getPB(name) {
    const all = []; (state.workoutSessions || []).forEach(sess => sess.exercises.forEach(ex => { if (ex.name === name) ex.sets.forEach(s => { if (s.weight) all.push({ weight: parseFloat(s.weight), reps: parseInt(s.reps) || 0, date: sess.date }); }); }));
    return all.length ? all.reduce((b, s) => s.weight > (b?.weight || 0) ? s : b, null) : null;
  }

  const sessions = state.workoutSessions || [];

  if (view === "session" && sessionProg) return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}><Btn onClick={() => setView("programs")}><i className="ti ti-arrow-left" aria-hidden="true" /> Back</Btn><p style={{ fontWeight: 500, fontSize: 15 }}>Logging: {sessionProg.name}</p></div>
      {sessionProg.exercises.map((ex, i) => {
        const pb = getPB(ex.name);
        return (
          <Card key={i}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
              <div><p style={{ fontSize: 15, fontWeight: 500 }}>{ex.name}</p>{pb && <p style={{ fontSize: 12, color: "#534AB7" }}>PB: {pb.weight}kg × {pb.reps} reps ({pb.date})</p>}</div>
              <a href={`https://www.youtube.com/results?search_query=${ex.ytQuery}`} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: "#185FA5", textDecoration: "none", display: "flex", alignItems: "center", gap: 4 }}><i className="ti ti-brand-youtube" aria-hidden="true" /> Watch</a>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 28px", gap: 6, marginBottom: 4 }}>
              <p style={{ fontSize: 11, color: "var(--color-text-secondary,#666)" }}>Reps</p>
              <p style={{ fontSize: 11, color: "var(--color-text-secondary,#666)" }}>Weight (kg)</p>
              <span />
            </div>
            {(sessionSets[i] || []).map((set, j) => (
              <div key={j} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 28px", gap: 6, marginBottom: 6, alignItems: "center" }}>
                <Inp type="number" value={set.reps} onChange={e => setSessionSets(s => ({ ...s, [i]: s[i].map((x, k) => k === j ? { ...x, reps: e.target.value } : x) }))} placeholder="10" />
                <Inp type="number" value={set.weight} onChange={e => setSessionSets(s => ({ ...s, [i]: s[i].map((x, k) => k === j ? { ...x, weight: e.target.value } : x) }))} placeholder="60" />
                <button onClick={() => setSessionSets(s => ({ ...s, [i]: s[i].filter((_, k) => k !== j) }))} style={{ background: "none", border: "none", cursor: "pointer", color: "#A32D2D", fontSize: 16 }}><i className="ti ti-x" aria-hidden="true" /></button>
              </div>
            ))}
            <Btn onClick={() => setSessionSets(s => ({ ...s, [i]: [...(s[i] || []), { reps: "", weight: "" }] }))} small><i className="ti ti-plus" aria-hidden="true" /> Add set</Btn>
          </Card>
        );
      })}
      <Card>
        <CT icon="ti-notes">Session notes</CT>
        <textarea value={sessionNotes} onChange={e => setSessionNotes(e.target.value)} placeholder="How did it feel? Any adjustments?" rows={3} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", resize: "vertical", fontFamily: "inherit", boxSizing: "border-box" }} />
      </Card>
      <Btn onClick={saveSession} primary style={{ width: "100%", justifyContent: "center" }}><i className="ti ti-device-floppy" aria-hidden="true" /> Save session</Btn>
    </div>
  );

  if (view === "history") return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}><Btn onClick={() => setView("programs")}><i className="ti ti-arrow-left" aria-hidden="true" /> Back</Btn><p style={{ fontWeight: 500, fontSize: 15 }}>Session History</p></div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        <Chip label="All" active={!histFilter} onClick={() => setHistFilter(null)} />
        {state.programs.map(p => <Chip key={p.id} label={p.name} active={histFilter === p.id} onClick={() => setHistFilter(p.id)} />)}
      </div>
      {!(histFilter ? sessions.filter(s => s.programId === histFilter) : sessions).length
        ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>No sessions yet.</p>
        : [...(histFilter ? sessions.filter(s => s.programId === histFilter) : sessions)].reverse().map(sess => (
          <Card key={sess.id}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <div><p style={{ fontSize: 15, fontWeight: 500 }}>{sess.programName}</p><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{sess.date}</p></div>
              <Tag color="purple">{sess.exercises.length} exercises</Tag>
            </div>
            {sess.exercises.map((ex, i) => (
              <div key={i} style={{ marginBottom: 8 }}>
                <p style={{ fontSize: 13, fontWeight: 500 }}>{ex.name}</p>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
                  {ex.sets.map((s, j) => <span key={j} style={{ fontSize: 12, background: "var(--color-background-secondary,#f0f0ec)", borderRadius: 6, padding: "2px 8px" }}>Set {j+1}: {s.reps} reps{s.weight ? ` @ ${s.weight}kg` : ""}</span>)}
                </div>
              </div>
            ))}
            {sess.notes && <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", fontStyle: "italic", marginTop: 6 }}>{sess.notes}</p>}
          </Card>
        ))}
    </div>
  );

  if (view === "suggest") return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}><Btn onClick={() => setView("programs")}><i className="ti ti-arrow-left" aria-hidden="true" /> Back</Btn><p style={{ fontWeight: 500, fontSize: 15 }}>Workout Suggestions</p></div>
      <Card>
        <CT icon="ti-target">Target Body Areas</CT>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          {BODY_AREAS.map(a => <Chip key={a.id} label={`${a.icon} ${a.label}`} active={selectedAreas.includes(a.id)} onClick={() => setSelectedAreas(prev => prev.includes(a.id) ? prev.filter(x => x !== a.id) : [...prev, a.id])} />)}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
          <div style={{ flex: "1 1 130px" }}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Fitness level</p>
            <Sel value={fitnessLevel} onChange={e => setFitnessLevel(e.target.value)} style={{ width: "100%" }}>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </Sel>
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Equipment</p>
            <Sel value={equipment} onChange={e => setEquipment(e.target.value)} style={{ width: "100%" }}>
              <option value="gym">Full gym</option>
              <option value="home">Home / bodyweight</option>
              <option value="minimal">Minimal (bands/dumbbells)</option>
            </Sel>
          </div>
        </div>
        <Btn onClick={getSuggestions} primary disabled={!selectedAreas.length || suggestLoading}><i className="ti ti-sparkles" aria-hidden="true" />{suggestLoading ? "Generating..." : "Suggest workout"}</Btn>
        <AIBox text={suggestResult} loading={suggestLoading} />
      </Card>
    </div>
  );

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <Btn onClick={() => setView("suggest")} style={{ flex: 1, justifyContent: "center" }}><i className="ti ti-sparkles" aria-hidden="true" /> Suggest a workout ↗</Btn>
        <Btn onClick={() => setView("history")} style={{ flex: 1, justifyContent: "center" }}><i className="ti ti-history" aria-hidden="true" /> History ({sessions.length})</Btn>
      </div>
      <Card>
        <CT icon="ti-search">Exercise Info</CT>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <Inp value={exSearch} onChange={e => setExSearch(e.target.value)} onKeyDown={e => e.key === "Enter" && searchEx()} placeholder="e.g. hip thrust, pull-up..." />
          <Btn onClick={searchEx} primary disabled={exLoading}><i className="ti ti-sparkles" aria-hidden="true" />{exLoading ? "..." : "Search"}</Btn>
        </div>
        <AIBox text={exResult} loading={exLoading} />
        {exResult && !exLoading && <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(exSearch + " proper form tutorial")}`} target="_blank" rel="noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 8, color: "#185FA5", fontSize: 13, textDecoration: "none" }}><i className="ti ti-brand-youtube" aria-hidden="true" /> Watch on YouTube</a>}
      </Card>
      <Card>
        <CT icon="ti-layout-list">Workout Programs</CT>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <Inp value={progName} onChange={e => setProgName(e.target.value)} onKeyDown={e => e.key === "Enter" && createProg()} placeholder="New program name..." />
          <Btn onClick={createProg} primary>Create</Btn>
        </div>
        {!state.programs.length ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>No programs yet. Create one above.</p>
          : state.programs.map(p => (
            <div key={p.id}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" }}>
                <div><p style={{ fontSize: 14, fontWeight: 500 }}>{p.name}</p><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{p.exercises.length} exercise(s)</p></div>
                <div style={{ display: "flex", gap: 6 }}>
                  <Btn onClick={() => startSession(p)} small style={{ background: "#EAF3DE", color: "#3B6D11", border: "0.5px solid #C0DD97" }}><i className="ti ti-player-play" aria-hidden="true" /> Start</Btn>
                  <Btn onClick={() => setActiveProg(activeProg === p.id ? null : p.id)} small>Edit</Btn>
                  <Btn onClick={() => { setState(s => ({ ...s, programs: s.programs.filter(x => x.id !== p.id) })); if (activeProg === p.id) setActiveProg(null); }} danger small><i className="ti ti-trash" aria-hidden="true" /></Btn>

                    <Inp value={exSets} onChange={e => setExSets(e.target.value)} placeholder="e.g. 3x10" style={{ flex: "1 1 90px" }} />

                      <div><p style={{ fontSize: 13, fontWeight: 500 }}>{e.name}</p><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{e.sets || "No template"}</p></div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <a href={`https://www.youtube.com/results?search_query=${e.ytQuery}`} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: "#185FA5", textDecoration: "none" }}><i className="ti ti-brand-youtube" aria-hidden="true" /></a>
                        <Btn onClick={() => setState(s => ({ ...s, programs: s.programs.map(x => x.id === p.id ? { ...x, exercises: x.exercises.filter((_, j) => j !== i) } : x) }))} danger small><i className="ti ti-trash" aria-hidden="true" /></Btn>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
      </Card>
    </div>
  );
}

// -- STEPS --
function StepsTab({ state, setState }) {
  const [stepsInput, setStepsInput] = useState("");
  const [goalInput, setGoalInput] = useState("");
  const [monthlyGoalInput, setMonthlyGoalInput] = useState("");
  const [histView, setHistView] = useState("monthly"); // "daily" | "monthly"

  const stepHistory = state.stepHistory || [];
  const monthlyStepGoal = state.goals.monthlySteps || (state.goals.steps * 30);

  function logSteps() {
    const v = parseInt(stepsInput) || 0; if (!v) return;
    const newHist = stepHistory.filter(h => h.date !== TODAY);
    newHist.push({ date: TODAY, steps: v });
    setState(s => ({ ...s, steps: v, stepHistory: newHist.slice(-365) }));
    setStepsInput("");
  }

  // Group history by month
  function getMonthlyData() {
    const byMonth = {};
    stepHistory.forEach(h => {
      const month = h.date.slice(0, 7); // "YYYY-MM"
      if (!byMonth[month]) byMonth[month] = { total: 0, days: 0 };
      byMonth[month].total += h.steps;
      byMonth[month].days += 1;
    });
    return Object.entries(byMonth).sort((a, b) => b[0] > a[0] ? 1 : -1).slice(0, 12);
  }

  function monthLabel(ym) {
    const [y, m] = ym.split("-");
    return new Date(parseInt(y), parseInt(m) - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  }

  const monthlyData = getMonthlyData();
  // current month total
  const currentMonth = TODAY.slice(0, 7);
  const currentMonthEntry = monthlyData.find(([m]) => m === currentMonth);
  const currentMonthTotal = currentMonthEntry ? currentMonthEntry[1].total : state.steps;

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 8, marginBottom: 12 }}>
        <MCard label="Today" value={state.steps.toLocaleString()} unit="steps" color="#534AB7" />
        <MCard label="Daily goal" value={state.goals.steps.toLocaleString()} unit="steps" />
        <MCard label="This month" value={currentMonthTotal.toLocaleString()} unit={`/ ${monthlyStepGoal.toLocaleString()}`} color="#1D9E75" />
        <MCard label="Burned today" value={Math.round(state.steps * 0.04)} unit="kcal est." color="#D85A30" />
      </div>

      <Card>
        <CT icon="ti-shoe">Log Steps</CT>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <Inp value={stepsInput} onChange={e => setStepsInput(e.target.value)} type="number" placeholder="Number of steps" />
          <Btn onClick={logSteps} primary>Log</Btn>
        </div>
        <PBar value={state.steps} max={state.goals.steps} color="#534AB7" />
        <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginTop: 4 }}>{state.steps.toLocaleString()} / {state.goals.steps.toLocaleString()} steps today</p>
        <div style={{ marginTop: 10 }}>
          <PBar value={currentMonthTotal} max={monthlyStepGoal} color="#1D9E75" />
          <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginTop: 4 }}>{currentMonthTotal.toLocaleString()} / {monthlyStepGoal.toLocaleString()} steps this month</p>
        </div>
      </Card>

      <Card>
        <CT icon="ti-settings">Step Goals</CT>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          <div style={{ flex: "1 1 130px" }}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Daily goal</p>
            <div style={{ display: "flex", gap: 8 }}>
              <Inp value={goalInput} onChange={e => setGoalInput(e.target.value)} type="number" placeholder={state.goals.steps.toLocaleString()} />
              <Btn onClick={() => { setState(s => ({ ...s, goals: { ...s.goals, steps: parseInt(goalInput) || s.goals.steps } })); setGoalInput(""); }}>Save</Btn>
            </div>
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Monthly goal</p>
            <div style={{ display: "flex", gap: 8 }}>
              <Inp value={monthlyGoalInput} onChange={e => setMonthlyGoalInput(e.target.value)} type="number" placeholder={monthlyStepGoal.toLocaleString()} />
              <Btn onClick={() => { setState(s => ({ ...s, goals: { ...s.goals, monthlySteps: parseInt(monthlyGoalInput) || monthlyStepGoal } })); setMonthlyGoalInput(""); }}>Save</Btn>
            </div>
          </div>
        </div>
      </Card>

      <Card>
        <CT icon="ti-chart-line">Step History</CT>
        <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
          <Chip label="Monthly" active={histView === "monthly"} onClick={() => setHistView("monthly")} />
          <Chip label="Daily (last 30)" active={histView === "daily"} onClick={() => setHistView("daily")} />
        </div>

        {histView === "monthly" && (
          !monthlyData.length ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>No history yet.</p>
          : monthlyData.map(([month, data], i) => (
            <div key={i} style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 2 }}>
                <span style={{ fontWeight: 500 }}>{monthLabel(month)}</span>
                <span>{data.total.toLocaleString()} steps · {data.days} days logged · avg {Math.round(data.total / data.days).toLocaleString()}/day</span>
              </div>
              <PBar value={data.total} max={monthlyStepGoal} color="#534AB7" />
              <p style={{ fontSize: 11, color: "var(--color-text-secondary,#666)", marginTop: 2 }}>{Math.round(data.total / monthlyStepGoal * 100)}% of monthly goal</p>
            </div>
          ))
        )}

        {histView === "daily" && (
          !stepHistory.length ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>No history yet.</p>
          : [...stepHistory].reverse().slice(0, 30).map((h, i) => (
            <div key={i} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--color-text-secondary,#666)" }}>
                <span>{h.date}</span><span>{h.steps.toLocaleString()} steps</span>
              </div>
              <PBar value={h.steps} max={state.goals.steps} color="#534AB7" />
            </div>
          ))
        )}
      </Card>
    </div>
  );
}

// -- HABITS --
function HabitsTab({ state, setState }) {
  const [bedtime, setBedtime] = useState(state.habits.bedtime || "");
  const [wakeTime, setWakeTime] = useState(state.habits.wakeTime || "");
  const [aiText, setAiText] = useState(""); const [aiLoading, setAiLoading] = useState(false);

  function calcSleepHrs(bed, wake) {
    if (!bed || !wake) return null;
    const [bh, bm] = bed.split(":").map(Number);
    const [wh, wm] = wake.split(":").map(Number);

      {last20.length >= 2 && (

          <div style={{ overflowX: "auto" }}>

          ))}
      </Card>
    </div>
  );

// -- CYCLE --
function computeCycleDay(cycle) {
  if (!cycle.periodDates || !cycle.periodDates.length) return null;
  const sorted = [...cycle.periodDates].sort((a, b) => a.start > b.start ? -1 : 1);
  const lastStart = new Date(sorted[0].start);
  const today = new Date();
  const diff = Math.floor((today - lastStart) / 86400000);
  const avgLen = cycle.avgCycleLength || 28;
  const dayOfCycle = diff % avgLen;

  const phases = [
    { name: "Menstrual", color: "#993556", bg: "#FBEAF0", border: "#F4C0D1", emoji: "🌑", range: [0, cycle.avgPeriodDuration || 5] },
    { name: "Follicular", color: "#0F6E56", bg: "#E1F5EE", border: "#9FE1CB", emoji: "🌿", range: [cycle.avgPeriodDuration || 5, 13] },
    { name: "Ovulation", color: "#534AB7", bg: "#EEEDFE", border: "#CECBF6", emoji: "✨", range: [13, 16] },
    { name: "Luteal", color: "#854F0B", bg: "#FAEEDA", border: "#FAC775", emoji: "🍂", range: [16, avgLen] },
  ];
  const phase = phases.find(p => dayOfCycle >= p.range[0] && dayOfCycle < p.range[1]) || phases[3];
  const nextPeriodIn = avgLen - dayOfCycle;
  return { ...phase, dayOfCycle: dayOfCycle + 1, nextPeriodIn, avgLen };
}

  // Symptoms
  const [sympDate, setSympDate] = useState(TODAY);
  const [checkedSymptoms, setCheckedSymptoms] = useState([]);
  const [sympNotes, setSympNotes] = useState("");
  // Settings
  const [avgLen, setAvgLen] = useState(String(state.cycle.avgCycleLength || 28));
  const [avgDur, setAvgDur] = useState(String(state.cycle.avgPeriodDuration || 5));
  // AI
  const [aiText, setAiText] = useState(""); const [aiLoading, setAiLoading] = useState(false);

  const cycle = state.cycle;
  const cycleInfo = computeCycleDay(cycle);

  function logPeriod() {
    if (!periodStart) return;
    const entry = { start: periodStart, end: periodEnd || null };
    const existing = (cycle.periodDates || []).findIndex(p => p.start === periodStart);
    let newDates;
    if (existing >= 0) newDates = cycle.periodDates.map((p, i) => i === existing ? entry : p);
    else newDates = [...(cycle.periodDates || []), entry];
    // Recalc avg cycle length if 2+ entries
    let newAvg = cycle.avgCycleLength;
    if (newDates.length >= 2) {
      const sorted = [...newDates].sort((a, b) => a.start > b.start ? 1 : -1);
      const diffs = [];
      for (let i = 1; i < sorted.length; i++) {
        const d = Math.floor((new Date(sorted[i].start) - new Date(sorted[i-1].start)) / 86400000);
        if (d > 0 && d < 60) diffs.push(d);
      }
      if (diffs.length) newAvg = Math.round(diffs.reduce((a, b) => a + b, 0) / diffs.length);
    }
    setState(s => ({ ...s, cycle: { ...s.cycle, periodDates: newDates, avgCycleLength: newAvg } }));
    setPeriodStart(""); setPeriodEnd("");
  }

  function logOvulation() {
    if (!ovDate) return;

                  { name: "Follicular", emoji: "🌿", color: "#0F6E56", desc: "Estrogen rises. Energy increases, great time to start new habits and try challenging workouts." },
                  { name: "Ovulation", emoji: "✨", color: "#534AB7", desc: "Peak estrogen. You're at your strongest - high-intensity workouts and social activities shine." },
                  { name: "Luteal", emoji: "🍂", color: "#854F0B", desc: "Progesterone rises then falls. Focus on consistency, strength training, and nurturing foods." },
                ].map((p, i, arr) => (
                  <div key={i} style={{ padding: "8px 0", borderBottom: i < arr.length - 1 ? "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" : "none", display: "flex", gap: 10 }}>
                    <span style={{ fontSize: 18 }}>{p.emoji}</span>
                    <div><p style={{ fontSize: 13, fontWeight: 500, color: p.color }}>{p.name}</p><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>{p.desc}</p></div>
                  </div>
                ))}
              </Card>
            </>
          ) : (
            <Card><p style={{ fontSize: 14, color: "var(--color-text-secondary,#666)" }}>Log your first period start date in the <strong>Log Period</strong> tab to see your cycle overview.</p></Card>
          )}

          <Card>
            <CT icon="ti-sparkles">AI Phase Recommendations</CT>
            {!cycleInfo ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>Log a period first.</p> : (
              <><Btn onClick={getAIAdvice} disabled={aiLoading}><i className="ti ti-sparkles" aria-hidden="true" />{aiLoading ? "Thinking..." : "Get food, workout & self-care advice ↗"}</Btn><AIBox text={aiText} loading={aiLoading} /></>
            )}
          </Card>
        </>
      )}

      {activeSection === "log" && (
        <Card>
          <CT icon="ti-calendar-plus">Log Period</CT>
          <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)", marginBottom: 12 }}>Enter your period start date (and optionally end date). The app will automatically calculate your average cycle length from your history.</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
            <div style={{ flex: "1 1 140px" }}><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Period start date *</p><input type="date" value={periodStart} onChange={e => setPeriodStart(e.target.value)} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", fontFamily: "inherit", boxSizing: "border-box" }} /></div>
            <div style={{ flex: "1 1 140px" }}><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Period end date (optional)</p><input type="date" value={periodEnd} onChange={e => setPeriodEnd(e.target.value)} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", fontFamily: "inherit", boxSizing: "border-box" }} /></div>
          </div>
          <Btn onClick={logPeriod} primary disabled={!periodStart}><i className="ti ti-plus" aria-hidden="true" /> Log period</Btn>
          <div style={{ marginTop: 16 }}>
            <p style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>Avg cycle settings (auto-calculated from history):</p>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <div style={{ flex: "1 1 120px" }}><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Avg cycle length (days)</p><Inp value={avgLen} onChange={e => setAvgLen(e.target.value)} type="number" min="21" max="45" /></div>
              <div style={{ flex: "1 1 120px" }}><p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Avg period duration (days)</p><Inp value={avgDur} onChange={e => setAvgDur(e.target.value)} type="number" min="1" max="10" /></div>
              <div style={{ display: "flex", alignItems: "flex-end" }}><Btn onClick={() => setState(s => ({ ...s, cycle: { ...s.cycle, avgCycleLength: parseInt(avgLen) || 28, avgPeriodDuration: parseInt(avgDur) || 5 } }))}>Save</Btn></div>
            </div>
          </div>
        </Card>
      )}

      {activeSection === "ovulation" && (
        <Card>
          <CT icon="ti-sparkles">Log Ovulation</CT>
          <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)", marginBottom: 12 }}>Mark a day you believe you ovulated (e.g. based on discharge, temperature, or OPK test).</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
            <input type="date" value={ovDate} onChange={e => setOvDate(e.target.value)} style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", fontFamily: "inherit" }} />
            <Btn onClick={logOvulation} primary><i className="ti ti-plus" aria-hidden="true" /> Log</Btn>
          </div>
          {(cycle.ovulationDates || []).length > 0 && (
            <div>
              <p style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>Logged ovulation dates:</p>
              {[...(cycle.ovulationDates || [])].sort((a, b) => b > a ? 1 : -1).slice(0, 6).map((d, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" }}>
                  <span style={{ fontSize: 14 }}>✨ {d}</span>
                  <Btn onClick={() => setState(s => ({ ...s, cycle: { ...s.cycle, ovulationDates: s.cycle.ovulationDates.filter(x => x !== d) } }))} danger small><i className="ti ti-trash" aria-hidden="true" /></Btn>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {activeSection === "symptoms" && (
        <Card>
          <CT icon="ti-stethoscope">Log Symptoms</CT>
          <div style={{ marginBottom: 10 }}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Date</p>
            <input type="date" value={sympDate} onChange={e => setSympDate(e.target.value)} style={{ padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", fontFamily: "inherit", width: "100%", boxSizing: "border-box" }} />
          </div>
          <p style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>Symptoms:</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {SYMPTOM_LIST.map(sym => <Chip key={sym} label={sym} active={checkedSymptoms.includes(sym)} onClick={() => toggleSymptom(sym)} />)}
          </div>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginBottom: 4 }}>Additional notes</p>
          <textarea value={sympNotes} onChange={e => setSympNotes(e.target.value)} placeholder="Any other observations, energy levels, mood..." rows={3} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", fontSize: 14, background: "var(--color-background-primary,#fff)", color: "var(--color-text-primary,#1a1a1a)", resize: "vertical", fontFamily: "inherit", boxSizing: "border-box", marginBottom: 10 }} />
          <Btn onClick={saveSymptoms} primary><i className="ti ti-device-floppy" aria-hidden="true" /> Save symptoms</Btn>
          {/* Show today's saved */}
          {(cycle.symptoms || {})[sympDate] && (
            <div style={{ marginTop: 12, padding: 10, background: "var(--color-background-secondary,#f8f8f5)", borderRadius: 8 }}>
              <p style={{ fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Saved for {sympDate}:</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {(cycle.symptoms[sympDate].checklist || []).map(s => <Tag key={s} color="pink">{s}</Tag>)}
              </div>
              {cycle.symptoms[sympDate].notes && <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)", marginTop: 6 }}>{cycle.symptoms[sympDate].notes}</p>}
            </div>
          )}
        </Card>
      )}

      {activeSection === "history" && (
        <Card>
          <CT icon="ti-history">Period History</CT>
          {!(cycle.periodDates || []).length ? <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)" }}>No periods logged yet.</p>
            : [...(cycle.periodDates || [])].sort((a, b) => b.start > a.start ? 1 : -1).map((p, i, arr) => {
              const duration = p.end ? Math.floor((new Date(p.end) - new Date(p.start)) / 86400000) + 1 : null;
              const nextStart = arr[i + 1]?.start;
              const cycleLen = nextStart ? Math.floor((new Date(p.start) - new Date(nextStart)) / 86400000) : null;
              return (
                <div key={i} style={{ padding: "10px 0", borderBottom: i < arr.length - 1 ? "0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.08))" : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <p style={{ fontSize: 14, fontWeight: 500 }}>🩸 {p.start}{p.end ? ` -> ${p.end}` : ""}</p>
                      <p style={{ fontSize: 12, color: "var(--color-text-secondary,#666)" }}>
                        {duration ? `${duration} days` : "End not logged"}
                        {cycleLen ? ` · Cycle: ${cycleLen} days` : ""}
                      </p>
                    </div>
                    <Btn onClick={() => setState(s => ({ ...s, cycle: { ...s.cycle, periodDates: s.cycle.periodDates.filter((_, j) => j !== (arr.length - 1 - i)) } }))} danger small><i className="ti ti-trash" aria-hidden="true" /></Btn>
                  </div>
                </div>
              );
            })}
        </Card>
      )}
    </div>
  );
}

// -- ROOT --
function App() {
  const [state, setStateRaw] = useState(loadState);
  const [activeTab, setActiveTab] = useState("nutrition");

  const setState = useCallback((updater) => {
    setStateRaw(prev => {
      const next = typeof updater === "function" ? updater(prev) : { ...prev, ...updater };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);

  return (
    <div style={{ maxWidth: 700, margin: "0 auto", paddingBottom: 60, fontFamily: "var(--font-sans,system-ui,sans-serif)" }}>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
      <div style={{ padding: "1.25rem 1rem 0" }}>
        <h1 style={{ fontSize: 20, fontWeight: 500 }}>Wellness Hub</h1>
        <p style={{ fontSize: 13, color: "var(--color-text-secondary,#666)", marginTop: 2 }}>{new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</p>
      </div>
      <div style={{ display: "flex", gap: 6, padding: "0.75rem 1rem", overflowX: "auto", scrollbarWidth: "none" }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ whiteSpace: "nowrap", padding: "6px 12px", borderRadius: 20, border: "0.5px solid var(--color-border-secondary,rgba(0,0,0,0.2))", background: activeTab === t.id ? "var(--color-text-primary,#1a1a1a)" : "var(--color-background-primary,#fff)", color: activeTab === t.id ? "var(--color-background-primary,#fff)" : "var(--color-text-secondary,#666)", fontSize: 13, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5, fontFamily: "inherit" }}>
            <i className={`ti ${t.icon}`} aria-hidden="true" /> {t.label}
          </button>
        ))}
      </div>
      <div style={{ padding: "0 1rem" }}>
        {activeTab === "nutrition" && <NutritionTab state={state} setState={setState} />}
        {activeTab === "workouts" && <WorkoutsTab state={state} setState={setState} />}
        {activeTab === "steps" && <StepsTab state={state} setState={setState} />}
        {activeTab === "habits" && <HabitsTab state={state} setState={setState} />}
        {activeTab === "goals" && <GoalsTab state={state} setState={setState} />}
        {activeTab === "weight" && <WeightTab state={state} setState={setState} />}
        {activeTab === "cycle" && <CycleTab state={state} setState={setState} />}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  
</script>
</body>
</html>
